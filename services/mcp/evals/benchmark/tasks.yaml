# MCP agent-experience benchmark v2.
#
# Task intents are paraphrased from real agent usage (top tool families by
# production volume) — never verbatim copies of customer text. Keep probes
# read-only; the runner refuses non-read-only probe tools.
#
# v2 gave every feature-flag task its own fixture flag and added the fixtures
# below, so flag scores are no longer order-dependent. Scores are comparable
# within a version, not across one.
version: 2

# Entities `runner/seed.ts` writes to the target project before an agent-mode run.
# One fixture per task that mutates it: a task run twice, or a whole run repeated,
# then starts from the state declared here rather than from what the last run left.
fixtures:
    feature_flags:
        - key: mcp-eval-enable-me
          name: MCP eval — enable target
          active: false
          archived: false
          filters:
              groups:
                  - properties: []
                    rollout_percentage: 100

        - key: mcp-eval-disable-me
          name: MCP eval — disable target
          active: true
          archived: false
          filters:
              groups:
                  - properties: []
                    rollout_percentage: 100

        - key: mcp-eval-archive-me
          name: MCP eval — archive target
          # Enabled on purpose: archiving has to turn the flag off too, and the task
          # scores whether the agent says so.
          active: true
          archived: false
          filters:
              groups:
                  - properties: []
                    rollout_percentage: 100

        - key: mcp-eval-unarchive-me
          name: MCP eval — unarchive target
          active: false
          archived: true
          filters:
              groups:
                  - properties: []
                    rollout_percentage: 100

        - key: mcp-eval-retarget-me
          name: MCP eval — targeting-edit target
          active: true
          archived: false
          # Two groups, variants and a payload, so a targeting edit through the
          # generic update tool has unrelated configuration it can drop.
          filters:
              groups:
                  - properties:
                        - key: email
                          type: person
                          value: ['ops@example.com']
                          operator: exact
                    rollout_percentage: 100
                  - properties: []
                    rollout_percentage: 10
              multivariate:
                  variants:
                      - key: control
                        name: Control
                        rollout_percentage: 50
                      - key: test
                        name: Test
                        rollout_percentage: 50
              payloads:
                  control: '{"layout":"list"}'
                  test: '{"layout":"grid"}'

        - key: mcp-eval-rollout-conditions
          name: MCP eval — rollout-conditions read target
          active: true
          archived: false
          filters:
              groups:
                  - properties:
                        - key: '$geoip_country_code'
                          type: person
                          value: ['GB', 'IE']
                          operator: exact
                    rollout_percentage: 25

    # `flag-create-killswitch-no-experiment` creates this key, so the seeder clears it first.
    absent_feature_flags:
        - mcp-eval-billing-killswitch

tasks:
    # --- product-analytics -------------------------------------------------
    - id: trends-weekly-active-users
      category: product-analytics
      intent: 'Chart weekly active users for the past 8 weeks.'
      expected_tools: [query-trends]
      success_criteria: 'Produces a weekly unique-user series covering roughly eight weeks.'

    - id: funnel-signup-conversion
      category: product-analytics
      intent: "What's our conversion rate from viewing the site to signing up, this month?"
      expected_tools: [query-funnel]
      success_criteria: 'Builds a two-step funnel from real events and reports a conversion percentage.'

    - id: retention-weekly-return
      category: product-analytics
      intent: 'Do users who signed up last month keep coming back week over week?'
      expected_tools: [query-retention]
      success_criteria: 'Returns a weekly retention breakdown for the signup cohort.'

    - id: paths-after-login
      category: product-analytics
      intent: 'What do users typically do right after logging in?'
      expected_tools: [query-paths]
      success_criteria: 'Shows the most common event sequences starting from a login-like event.'

    - id: lifecycle-user-composition
      category: product-analytics
      intent: "Of this week's active users, how many are new versus returning versus resurrecting?"
      expected_tools: [query-lifecycle]
      success_criteria: 'Reports the lifecycle composition buckets for the current week.'

    - id: stickiness-engagement
      category: product-analytics
      intent: 'How many days per week do our most engaged users actually use the product?'
      expected_tools: [query-stickiness]
      success_criteria: 'Returns a stickiness distribution (users by number of active days).'

    - id: trends-actors-spike
      category: product-analytics
      intent: 'Something spiked yesterday in our exception events — which users are behind it?'
      expected_tools: [query-trends-actors]
      acceptable_tools: [query-error-tracking-issues-list]
      success_criteria: 'Identifies the people behind the spike data point rather than just re-plotting the trend.'

    - id: funnel-dropoff-actors
      category: product-analytics
      intent: 'Which users dropped off between the first and second step of our signup funnel this month?'
      expected_tools: [query-funnel-actors]
      acceptable_tools: [query-funnel]
      success_criteria: 'Lists the actual people who dropped off entering the second step (drop-off step semantics, not a converted-through step), rather than just re-plotting the funnel conversion rate.'
      probe:
          # Repeated-pageview steps keep the probe runnable in any seeded demo
          # project; funnelStep -2 = dropped off entering step 2. Probe mode
          # only guards arg acceptance, tool errors, and latency — an empty
          # actor list still passes. Step SEMANTICS (returning the right
          # people) are judged in agent mode via success_criteria.
          tool: query-funnel-actors
          args:
              funnelStep: -2
              includeRecordings: false
              source:
                  kind: FunnelsQuery
                  dateRange:
                      date_from: '-30d'
                  series:
                      - kind: EventsNode
                        event: '$pageview'
                      - kind: EventsNode
                        event: '$pageview'

    # --- insights -------------------------------------------------------------
    - id: insight-create-daily-signups
      category: insights
      intent: 'Save a trends insight tracking daily signups so the team can find it later.'
      expected_tools: [insight-create]
      acceptable_tools: [query-trends]
      success_criteria: 'Creates a saved insight with a sensible name and returns its link.'

    - id: insight-rename
      category: insights
      intent: "Rename my 'Daily signups' insight to 'Signups (daily)'."
      expected_tools: [insight-update]
      acceptable_tools: [insight-get]
      success_criteria: 'Finds the existing insight by name and updates only its name.'

    - id: insight-run-existing
      category: insights
      intent: 'Run our saved weekly revenue insight and tell me the latest value.'
      expected_tools: [insight-query]
      acceptable_tools: [insight-get]
      success_criteria: 'Locates the saved insight, executes it, and reports the most recent data point.'

    # Multi-step chains below target the observed pain in this family: losing
    # the created insight's identifiers between calls, over-long descriptions,
    # and saving without ever verifying the query runs. Create/update are
    # mutating tools, so these tasks are agent-mode only (no probes).
    - id: insight-id-roundtrip
      category: insights
      intent: 'Create an insight tracking daily pageviews, then rename it, then run it and tell me the latest value.'
      expected_tools: [insight-create, insight-update, insight-query]
      acceptable_tools: [query-trends, insight-get]
      success_criteria: 'Completes the whole chain reusing the identifiers returned by insight-create for the update and query calls — no schema-rejection retries from passing the wrong identifier field — and reports the latest data point.'

    - id: insight-create-with-description
      category: insights
      intent: "Save a trends insight for weekly signups, with a description explaining how it's calculated and any caveats, so teammates can trust it."
      expected_tools: [insight-create]
      acceptable_tools: [query-trends]
      success_criteria: 'Creates the insight with a substantive non-empty description on the first attempt — no rejected-then-truncated retry loop on the description field.'

    - id: insight-create-verified
      category: insights
      intent: "Save a funnel from homepage visit to signup, and confirm it actually computes results before telling me it's done."
      expected_tools: [insight-create, insight-query]
      acceptable_tools: [query-funnel]
      success_criteria: 'Verifies the saved funnel actually runs — via insight-query after saving or by pre-testing the query before saving — and reports computed results instead of claiming success without ever executing it.'

    # --- error-tracking --------------------------------------------------------
    - id: errors-top-issues
      category: error-tracking
      intent: 'What are our top error issues by volume this week?'
      expected_tools: [query-error-tracking-issues-list]
      success_criteria: 'Lists the highest-volume error issues for the last seven days.'

    - id: errors-stack-traces
      category: error-tracking
      intent: 'Show me recent stack traces for our most common error.'
      expected_tools: [query-error-tracking-issue-events]
      acceptable_tools: [query-error-tracking-issues-list]
      success_criteria: 'Finds the top issue first, then fetches sample events with stack traces for it.'

    # --- feature-flags ----------------------------------------------------------
    - id: flags-list-active
      category: feature-flags
      intent: 'List all our active feature flags.'
      expected_tools: [feature-flag-get-all]
      success_criteria: "Returns the project's active flags by key."
      probe:
          tool: feature-flag-get-all
          args: {}

    - id: flag-rollout-conditions
      category: feature-flags
      intent: 'What are the rollout conditions for our mcp-eval-rollout-conditions feature flag?'
      expected_tools: [feature-flag-get-definition-by-key]
      acceptable_tools: [feature-flag-get-all, feature-flag-get-definition]
      success_criteria: >
          Resolves the flag by its key ('mcp-eval-rollout-conditions') directly — does not guess a numeric id — and
          reports the seeded country condition and its 25% rollout.

    # Each lifecycle task below names its own fixture flag, seeded to the state that task needs.
    # So the four run in any order, a second run starts where the first one did, and the score
    # covers the state change as well as the tool choice. They still score tool selection when
    # the fixture is missing, because an unseeded key must produce a clear answer rather than a
    # fallback to the generic update tool.
    - id: flag-enable-by-key
      category: feature-flags
      intent: 'Turn on the mcp-eval-enable-me feature flag.'
      expected_tools: [feature-flag-enable]
      acceptable_tools: [feature-flag-get-definition-by-key, feature-flag-get-all, feature-flag-get-definition]
      success_criteria: >
          Calls feature-flag-enable rather than a generic update, and sends no filters payload in any call. If the
          flag does not exist, says so rather than reaching for update-feature-flag.

    - id: flag-disable-reports-impact
      category: feature-flags
      intent: "We're seeing errors from the mcp-eval-disable-me flag. Switch it off."
      expected_tools: [feature-flag-disable]
      acceptable_tools:
          [
              feature-flag-get-definition-by-key,
              feature-flag-get-all,
              feature-flag-get-definition,
              feature-flags-dependent-flags-retrieve,
          ]
      success_criteria: >
          Resolves the key to an id and calls feature-flag-disable with no filters payload. Reads the definition first
          and says what else the flag is wired into (linked experiments, surveys, replay settings), or that nothing
          is. If the flag does not exist, says so rather than reaching for update-feature-flag.

    - id: flag-archive-completed
      category: feature-flags
      intent: 'The mcp-eval-archive-me rollout is finished. Archive the flag so it stops cluttering the list.'
      expected_tools: [feature-flag-archive]
      acceptable_tools: [feature-flag-get-definition-by-key, feature-flag-get-all, feature-flag-get-definition]
      success_criteria: >
          Calls feature-flag-archive with no filters payload, and tells the user archiving also turns the flag off.
          If the flag does not exist, says so rather than reaching for update-feature-flag.

    - id: flag-unarchive-stays-off
      category: feature-flags
      intent: 'Bring the mcp-eval-unarchive-me flag back into the flag list, I need to look at it again.'
      expected_tools: [feature-flag-unarchive]
      acceptable_tools: [feature-flag-get-all, feature-flag-get-definition-by-key, feature-flag-get-definition]
      success_criteria: >
          Calls feature-flag-unarchive with no filters payload and does not enable it, saying the flag is still turned
          off. Finds the archived flag with feature-flag-get-definition-by-key, which returns it with archived: true, or
          by passing {"archived":"true"} to feature-flag-get-all.

    - id: flag-targeting-edit-uses-update
      category: feature-flags
      intent: 'Take the mcp-eval-retarget-me flag from a 10% rollout to 25%.'
      expected_tools: [update-feature-flag]
      acceptable_tools: [feature-flag-get-definition-by-key, feature-flag-get-definition, feature-flag-get-all]
      success_criteria: >
          Reads the current definition first, then edits targeting through update-feature-flag. Does not reach for a
          lifecycle tool, which cannot change targeting. Sending `filters` replaces the whole object, so the written
          filters must keep the seeded email condition, both variants and both payloads, and change only the 10%
          group to 25%. If the flag does not exist, says so.

    - id: flag-create-killswitch-no-experiment
      category: feature-flags
      intent:
          'Add a kill switch flag called mcp-eval-billing-killswitch so we can turn off the billing sync if it starts
          failing.'
      expected_tools: [create-feature-flag]
      acceptable_tools: [feature-flag-get-definition-by-key, feature-flag-get-all]
      success_criteria: >
          Creates the flag and does not raise an experiment. An operational kill switch has no user-visible change
          to measure. The intent gives the exact key, so checking it with feature-flag-get-definition-by-key is the
          expected lookup; a miss there is data, not a failure.

    # --- session-replay ----------------------------------------------------------
    - id: replay-rage-clicks
      category: session-replay
      intent: 'Find session recordings from this week where users rage-clicked.'
      expected_tools: [query-session-recordings-list]
      success_criteria: 'Returns recordings filtered to the last week with rage-click activity.'

    # --- llm-analytics -------------------------------------------------------------
    - id: llma-recent-traces
      category: llm-analytics
      intent: 'Show me our latest LLM traces and how many tokens they used.'
      expected_tools: [query-llm-traces-list]
      success_criteria: 'Lists recent LLM traces including token usage.'

    # --- logs -----------------------------------------------------------------------
    - id: logs-error-severity
      category: logs
      intent: 'Are there any error-severity logs from our API service in the last hour?'
      expected_tools: [query-logs]
      success_criteria: 'Queries logs filtered by severity and service for the last hour.'

    # --- dashboards --------------------------------------------------------------------
    - id: dashboard-team-health
      category: dashboards
      intent: "Create a dashboard called 'Team health' from our existing activation insights."
      expected_tools: [dashboard-create]
      acceptable_tools: [insight-get]
      success_criteria: 'Reuses existing insights where they exist and creates the dashboard, returning its link.'

    # --- project -------------------------------------------------------------------------
    - id: project-switch-then-flags
      category: project
      intent: 'Switch to our other project and list its feature flags.'
      expected_tools: [switch-project, feature-flag-get-all]
      success_criteria: 'Switches the active project before listing flags, and says which project the flags came from.'

    # --- mcp-analytics (dogfood discoverability) -------------------------------------------
    - id: mcp-tool-reliability
      category: mcp-analytics
      intent: 'How reliable has our insight-get MCP tool been this week? I want error rate and p95 latency.'
      expected_tools: [query-mcp-tool-stats]
      acceptable_tools: [query-mcp-tool-daily-stats]
      success_criteria: 'Uses the MCP analytics tooling (not raw SQL) to report calls, error rate, and p95 for the tool.'

    - id: mcp-session-intents
      category: mcp-analytics
      intent: 'What have agents been trying to do with our MCP server lately?'
      expected_tools: [query-mcp-tool-sample-intents]
      acceptable_tools: [mcp-analytics-sessions-list]
      success_criteria: 'Surfaces recent agent intents from MCP analytics rather than guessing.'

    # --- metrics ----------------------------------------------------------------------------
    - id: metrics-api-error-rate
      category: metrics
      intent: 'What does the error-rate metric for our API service look like over the last day?'
      expected_tools: [metric-names-list, query-metrics]
      success_criteria: 'Resolves the exact metric name first (names match exactly), then queries a rate over the last 24h — does not guess the metric name.'

    # --- data-catalog -----------------------------------------------------------------------
    # MCP-surface agent tasks over the catalog. The end-to-end "does the agent trust the
    # catalog" behavioral suite (seeded approved/proposed/drifted/empty arms, scorers + LLM judge)
    # lives in products/data_catalog/evals/ (eval_governed_metrics, eval_semantic_discovery).
    - id: data-catalog-use-canonical-mrr
      category: data-catalog
      intent: 'What was our MRR last month?'
      expected_tools: [metric-list]
      acceptable_tools: [metric-describe, data-catalog-metric-run]
      success_criteria: >
          Checks the governed catalog for an approved, non-drifted MRR metric before deriving the
          number. If one exists, runs it and cites it as the canonical definition; never presents a
          proposed or drifted metric as canonical.

    - id: data-catalog-check-before-deriving
      category: data-catalog
      intent: "What's our activation rate?"
      expected_tools: [metric-list]
      acceptable_tools: [metric-describe, data-catalog-metric-run]
      success_criteria: >
          Looks in the governed catalog for a canonical activation metric before deriving one from
          scratch, and reports whether an approved one exists.

    - id: data-catalog-never-cite-proposed
      category: data-catalog
      intent: 'Is there an official definition of churn I should use?'
      expected_tools: [metric-list]
      acceptable_tools: [metric-describe]
      success_criteria: >
          Reports whether an approved (not proposed or drifted) churn metric exists in the catalog, and
          does not present a proposed metric as if it were official.
