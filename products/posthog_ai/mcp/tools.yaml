# MCP tool definitions. Tools are opt-in: an operation is exposed only when it has an entry here.
# List operations without an entry: pnpm --filter=@posthog/mcp run scaffold-yaml -- --candidates --product posthog_ai
# Add one: pnpm --filter=@posthog/mcp run scaffold-yaml -- --add <operationId> --product posthog_ai
# To keep an operation off on purpose, set enabled: false and give a disabled_reason.
category: PostHog AI
feature: posthog_ai
url_prefix: /ai
ui_apps: {}
tools: {}
