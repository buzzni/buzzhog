# MCP tool definitions. Tools are opt-in: an operation is exposed only when it has an entry here.
# List operations without an entry: pnpm --filter=@posthog/mcp run scaffold-yaml -- --candidates --product billing
# Add one: pnpm --filter=@posthog/mcp run scaffold-yaml -- --add <operationId> --product billing
# To keep an operation off on purpose, set enabled: false and give a disabled_reason.
category: Billing
feature: billing
url_prefix: /organization/billing
ui_apps: {}
tools: {}
